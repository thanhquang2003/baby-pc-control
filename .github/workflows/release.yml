name: Release build

# Builds the Windows executables and a ready-to-install ZIP.
#  - push a tag like v2.2.0  -> ZIP + checksum are attached to that GitHub Release
#  - Run workflow (manual)   -> ZIP is only kept as a workflow artifact (a dry run)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build executables
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package ZIP
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME }
          else { $version = "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          $name = "BabyControl-$version-windows-x64"
          $stage = Join-Path $PWD "stage\$name"
          New-Item -ItemType Directory -Path "$stage\scripts" -Force | Out-Null
          Copy-Item dist\babycontrol-service.exe, dist\babycontrol-kiosk.exe, dist\babycontrol-admin.exe $stage
          Copy-Item CAI_DAT.bat, GO_CAI_DAT.bat, packaging\HUONG_DAN.txt $stage
          Copy-Item scripts\setup.ps1, scripts\remove.ps1, scripts\install_service.ps1, scripts\uninstall_service.ps1 "$stage\scripts"
          Compress-Archive -Path "$stage\*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "ZIP_NAME=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem "$stage" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Keep the ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyControl-windows-x64
          path: |
            BabyControl-*.zip
            BabyControl-*.zip.sha256

      - name: Attach to the GitHub Release (tags only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "BabyControl $env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME $env:ZIP_NAME "$($env:ZIP_NAME).sha256" --clobber
